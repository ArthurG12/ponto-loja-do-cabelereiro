name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/rep-p-arp]

permissions:
  contents: read

jobs:
  build-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check backend JavaScript syntax
        run: |
          node --check server/index.js
          node --check server/rep-p.js
          node --check scripts/dev.mjs
      - name: Build frontend
        run: npm run build
